[project]
name = "DP"
version = "0.1.0"
description = "Diffusion Policy reimplementation for robotic manipulation"
requires-python = "==3.10.*"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "numpy",
    "einops",
    "lerobot>=0.4",
    "h5py",
    "tqdm",
    "av",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "matplotlib",
    "pytest",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", marker = "platform_system == 'Linux'" },
]
torchvision = [
    { index = "pytorch-cu118", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "diffusion_policy",
    "training",
    "evaluation",
]