[project]
name = "diffusion-policy-reimplement"
version = "0.1.0"
requires-python = "==3.9.*"
dependencies = [
    "torch",
    "torchvision",
    "diffusers",
    "zarr",
    "numpy",
    "transformers",
    "wandb",
    "pymunk",
    "pygame",
    "matplotlib",
    "einops",
    "opencv-python",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", marker = "platform_system == 'Linux'" },
]
torchvision = [
    { index = "pytorch-cu118", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "diffusion_policy",
    "training",
    "eval",
]
